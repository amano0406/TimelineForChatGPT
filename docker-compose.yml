name: timeline-for-chatgpt

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    working_dir: /workspace
    environment:
      TIMELINE_FOR_CHATGPT_DOCKER: "1"
      TIMELINE_FOR_CHATGPT_SETTINGS: /workspace/settings.json
      TIMELINE_FOR_CHATGPT_OUTPUT_ROOT: /workspace/output
      TIMELINE_FOR_CHATGPT_APPDATA_ROOT: /shared/app-data
      TIMELINE_FOR_CHATGPT_CACHE_ROOT: /shared/cache
      TIMELINE_FOR_CHATGPT_UPLOADS_ROOT: /tmp/timeline-for-chatgpt/uploads
      TIMELINE_FOR_CHATGPT_OUTPUTS_ROOT: /shared/app-data/runs
    volumes:
      - "${TIMELINE_FOR_CHATGPT_HOST_SETTINGS_PATH:-./settings.json}:/workspace/settings.json"
      - "${TIMELINE_FOR_CHATGPT_HOST_OUTPUT_ROOT:-C:/TimelineData/chatgpt}:/workspace/output"
      - "${TIMELINE_FOR_CHATGPT_HOST_APPDATA_ROOT:-app-data}:/shared/app-data"
      - "${TIMELINE_FOR_CHATGPT_HOST_CACHE_ROOT:-cache-data}:/shared/cache"

volumes:
  app-data:
  cache-data:
