name: timelineforchatgpt

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    working_dir: /workspace
    environment:
      TIMELINE_FOR_CHATGPT_DOCKER: "1"
      TIMELINE_FOR_CHATGPT_SETTINGS: /workspace/settings.json
      TIMELINE_FOR_CHATGPT_APPDATA_ROOT: /workspace/data/app-data
      TIMELINE_FOR_CHATGPT_UPLOADS_ROOT: /workspace/data/uploads
      TIMELINE_FOR_CHATGPT_OUTPUTS_ROOT: /workspace/data/outputs
    volumes:
      - ./:/workspace
      - ./data/inputs:/workspace/data/inputs
      - ./data/outputs:/workspace/data/outputs
      - ./data/state:/workspace/data/state
