name: timelineforchatgpt

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      TIMELINE_FOR_CHATGPT_RUNTIME_DEFAULTS: /app/config/runtime.defaults.json
      TIMELINE_FOR_CHATGPT_APPDATA_ROOT: /shared/app-data
      TIMELINE_FOR_CHATGPT_UPLOADS_ROOT: /shared/uploads
      TIMELINE_FOR_CHATGPT_OUTPUTS_ROOT: /shared/outputs
    volumes:
      - app-data:/shared/app-data
      - uploads:/shared/uploads
      - outputs:/shared/outputs

volumes:
  app-data:
  uploads:
  outputs:
