name: chatgpt2timeline

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      CHATGPT2TIMELINE_RUNTIME_DEFAULTS: /app/config/runtime.defaults.json
      CHATGPT2TIMELINE_APPDATA_ROOT: /shared/app-data
      CHATGPT2TIMELINE_UPLOADS_ROOT: /shared/uploads
      CHATGPT2TIMELINE_OUTPUTS_ROOT: /shared/outputs
    ports:
      - "${CHATGPT2TIMELINE_WEB_PORT:-8088}:8080"
    volumes:
      - app-data:/shared/app-data
      - uploads:/shared/uploads
      - outputs:/shared/outputs
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      CHATGPT2TIMELINE_RUNTIME_DEFAULTS: /app/config/runtime.defaults.json
      CHATGPT2TIMELINE_APPDATA_ROOT: /shared/app-data
      CHATGPT2TIMELINE_UPLOADS_ROOT: /shared/uploads
      CHATGPT2TIMELINE_OUTPUTS_ROOT: /shared/outputs
    volumes:
      - app-data:/shared/app-data
      - uploads:/shared/uploads
      - outputs:/shared/outputs

volumes:
  app-data:
  uploads:
  outputs:
